<!DOCTYPE html>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/icon-180.png">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #14211a;
    color: #cfe3d2;
    font-family: "Courier New", Courier, monospace;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    background: #2f5d3a;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 4px #1d2f22, 0 12px 40px rgba(0, 0, 0, 0.6);
    cursor: default;
    touch-action: none;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  /* Подсказка для телефонов: играть нужно с клавиатурой. */
  #touch-hint {
    display: none;
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    margin: 0;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.45;
    text-align: center;
    color: #dfe9df;
    background: rgba(10, 20, 14, 0.92);
    border: 2px solid #3b5f43;
    border-radius: 10px;
  }
  @media (hover: none) and (pointer: coarse) {
    #touch-hint { display: block; }
  }
  /* Сообщение, если игра не загрузилась. */
  #fallback {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    font-size: 15px;
    line-height: 1.6;
    background: #14211a;
  }
  #fallback[hidden] { display: none; }
  #fallback b { color: #ffdf7a; }
  noscript p {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 24px;
    text-align: center;
    background: #14211a;
    font-size: 15px;
  }
</style>
</head>
<body>
  <h1 class="sr-only">Жизнь в лесу — пиксельная игра о выживании в лесу</h1>

  <div id="wrap">
    <canvas id="game" width="960" height="600" role="application" aria-label="Игра «Жизнь в лесу»"></canvas>
  </div>

  <p id="touch-hint">
    Игра рассчитана на ноутбук: нужна клавиатура (WASD или стрелки).
    На телефоне пройти не получится.
  </p>

  <div id="fallback" hidden>
    <p>
      <b>Игра не загрузилась.</b><br>
      Обновите страницу (F5). Если не помогло — проверьте, что файл
      <code>game.js</code> лежит рядом с <code>index.html</code>.
    </p>
  </div>

  <noscript>
    <p>Для игры нужен включённый JavaScript в браузере.</p>
  </noscript>

  <script src="game.js" charset="utf-8"></script>
  <script>
    // Если game.js не загрузился или упал при старте — показываем понятное сообщение
    // вместо пустого зелёного прямоугольника.
    (function () {
      var ok = false;
      try {
        ok = typeof state === 'string' && typeof requestAnimationFrame === 'function';
      } catch (e) {
        ok = false;
      }
      if (!ok) document.getElementById('fallback').hidden = false;
    })();
  </script>
</body>
</html>
